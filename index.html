<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PERQ Sales Tracker</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
  <style id="colHideStyle"></style>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="mark">▰</span>
      <div>
        <h1>PERQ Sales Tracker</h1>
        <p class="sub">Bookings &amp; Churn — live operational ledger</p>
      </div>
    </div>
    <div class="actions">
      <label class="btn ghost" id="importBtn">
        Import .xlsx
        <input type="file" id="importFile" accept=".xlsx" hidden />
      </label>
      <a class="btn ghost" id="exportBtn" href="/api/export">Export .xlsx</a>
      <button class="btn solid" id="addRowBtn">+ Add row</button>
      <button class="btn ghost" id="usersBtn" hidden>Users</button>
      <span class="user-chip" id="userChip"></span>
      <button class="btn ghost" id="logoutBtn" hidden>Log out</button>
    </div>
  </header>

  <nav class="tabs">
    <button class="tab active" data-tab="dashboard">Dashboard</button>
    <button class="tab" data-tab="bookings">Bookings</button>
    <button class="tab" data-tab="churn">Churn Tracker</button>
    <div class="view-tools">
      <button class="view-btn" id="toggleFilters">Hide filters</button>
      <div class="col-menu-wrap">
        <button class="view-btn" id="colBtn">Columns</button>
        <div class="col-menu" id="colMenu" hidden></div>
      </div>
      <div class="zoom" id="zoomGroup" title="Table size">
        <button class="view-btn" id="zoomOut" aria-label="Smaller">&minus;</button>
        <span id="zoomLevel">100%</span>
        <button class="view-btn" id="zoomIn" aria-label="Larger">&plus;</button>
      </div>
      <span class="status" id="status"></span>
    </div>
  </nav>

  <section class="summary" id="summary"></section>

  <main class="gridwrap" id="gridwrap">
    <div class="scroller" id="scroller">
      <table id="grid">
        <thead id="thead"></thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>
  </main>

  <div class="toast" id="toast"></div>

  <div class="modal" id="entryModal" hidden>
    <div class="modal-card entry-card">
      <div class="entry-head">
        <h2>New Booking</h2>
        <button type="button" class="entry-close" id="entryClose" title="Close">✕</button>
      </div>
      <form id="entryForm" class="entry-form" autocomplete="off"></form>
      <div class="entry-actions">
        <button type="button" class="btn ghost" id="entryCancel">Cancel</button>
        <button type="submit" class="btn solid" form="entryForm">Add booking</button>
      </div>
    </div>
  </div>

  <div class="modal" id="loginModal" hidden>
    <div class="modal-card">
      <h2>Sign in</h2>
      <p>PERQ Sales Tracker</p>
      <input type="text" id="loginUser" placeholder="Username" autocomplete="username" />
      <input type="password" id="loginPass" placeholder="Password" autocomplete="current-password" />
      <button class="btn solid" id="loginBtn">Sign in</button>
      <p class="err" id="loginErr"></p>
    </div>
  </div>

  <div class="modal" id="usersModal" hidden>
    <div class="modal-card users-card">
      <div class="entry-head">
        <h2>Users</h2>
        <button type="button" class="entry-close" id="usersClose" title="Close">✕</button>
      </div>
      <div class="users-list" id="usersList"></div>
      <form id="addUserForm" class="add-user" autocomplete="off">
        <h3>Add user</h3>
        <div class="add-user-row">
          <input type="text" id="newUserName" placeholder="Username" autocomplete="off" />
          <input type="password" id="newUserPass" placeholder="Password" autocomplete="new-password" />
          <select id="newUserRole">
            <option value="standard">Standard</option>
            <option value="admin">Admin</option>
            <option value="billing">Billing</option>
            <option value="viewer">Viewer</option>
          </select>
          <button type="submit" class="btn solid">Add</button>
        </div>
        <p class="err" id="addUserErr"></p>
      </form>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
